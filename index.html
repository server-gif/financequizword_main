<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b5d47" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://securepubads.g.doubleclick.net" crossorigin />
    <!-- Fonts use the native system stack (iOS SF Pro on Apple devices) — no webfont download. -->
    <!-- Title, description, canonical and Open Graph tags are rendered per page by <SEO />. -->
    <script>
      /* Apply saved theme before first paint so there is no light flash on load. */
      (function () {
        try {
          if (localStorage.getItem('ff-theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) { /* storage unavailable — stay light */ }
      })();
    </script>
    <style>
      /* Instant splash shown while the app bundle loads; faded out by main.jsx. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: #fbfaf7;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #app-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
      }
      .app-splash__brand {
        display: flex;
        align-items: center;
        gap: 12px;
        animation: app-splash-in 0.5s ease both;
      }
      .app-splash__mark {
        width: 52px;
        height: 52px;
        display: block;
        filter: drop-shadow(0 3px 8px rgba(11, 93, 71, 0.3));
      }
      .app-splash__name {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #13202b;
      }
      .app-splash__bar {
        position: relative;
        width: 130px;
        height: 3px;
        border-radius: 99px;
        background: #e4e1d8;
        overflow: hidden;
      }
      .app-splash__bar::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        border-radius: inherit;
        background: #0b5d47;
        animation: app-splash-slide 1s ease-in-out infinite;
      }
      @keyframes app-splash-slide {
        0% { left: -40%; }
        100% { left: 100%; }
      }
      @keyframes app-splash-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash { transition-duration: 0.01ms; }
        .app-splash__brand { animation: none; }
        .app-splash__bar::after { animation-duration: 2s; }
      }
      /* Splash follows the saved dark theme too. */
      html[data-theme='dark'] #app-splash {
        background: #0a1626;
      }
      html[data-theme='dark'] .app-splash__name {
        color: #e8eef7;
      }
      html[data-theme='dark'] .app-splash__bar {
        background: #223753;
      }
      html[data-theme='dark'] .app-splash__bar::after {
        background: #3f8cff;
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="app-splash__brand">
        <svg class="app-splash__mark" viewBox="0 0 512 512" aria-hidden="true">
          <defs>
            <linearGradient id="ffSplashLogoBg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#10C9A0"/>
              <stop offset="0.55" stop-color="#008F70"/>
              <stop offset="1" stop-color="#005642"/>
            </linearGradient>
            <linearGradient id="ffSplashLogoMint" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#B8FF9B"/>
              <stop offset="1" stop-color="#32D889"/>
            </linearGradient>
            <linearGradient id="ffSplashLogoWhiteMint" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffffff"/>
              <stop offset="1" stop-color="#A5FFD9"/>
            </linearGradient>
            <linearGradient id="ffSplashLogoGold" x1="0" y1="0" x2="0.8" y2="1">
              <stop offset="0" stop-color="#FFF66B"/>
              <stop offset="1" stop-color="#FFC928"/>
            </linearGradient>
            <filter id="ffSplashLogoShadow" x="-20%" y="-20%" width="140%" height="150%">
              <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#003F34" flood-opacity="0.35"/>
            </filter>
          </defs>
          <rect x="28" y="28" width="456" height="456" rx="76" fill="url(#ffSplashLogoBg)"/>
          <g filter="url(#ffSplashLogoShadow)">
            <path d="M153 367V192c0-58 39-97 98-97h111c-15 31-39 47-77 47h-52c-28 0-43 17-43 43v24h108c-13 27-34 42-67 42h-41v116c0 28-15 43-43 43-27 0-43-15-43-43Z" fill="url(#ffSplashLogoMint)"/>
            <path d="M153 209c0-31 15-52 43-66 15-8 34-11 56-11h110c-15 30-39 46-77 46h-52c-28 0-43 17-43 43v20h-37Z" fill="#53E8A2" opacity="0.92"/>
            <path d="M153 367V258h37v109c0 28-15 43-43 43-12 0-22-3-29-10 22-2 35-13 35-33Z" fill="url(#ffSplashLogoWhiteMint)"/>
            <rect x="221" y="321" width="43" height="76" rx="13" fill="url(#ffSplashLogoWhiteMint)"/>
            <rect x="278" y="286" width="43" height="111" rx="13" fill="url(#ffSplashLogoMint)"/>
            <rect x="335" y="244" width="43" height="153" rx="13" fill="url(#ffSplashLogoGold)"/>
          </g>
        </svg>
        <span class="app-splash__name">FinzoriaFinance</span>
      </div>
      <span class="app-splash__bar"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
