<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://securepubads.g.doubleclick.net" crossorigin />
    <!-- Fonts use the native system stack (iOS SF Pro on Apple devices) — no webfont download. -->
    <!-- Title, description, canonical and Open Graph tags are rendered per page by <SEO />. -->
    <script>
      /* Apply the saved theme before first paint so there is no flash on load.
         Dark (the main site's navy palette) is the default; light is opt-in. */
      (function () {
        try {
          var saved = localStorage.getItem('ff-theme');
          document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <style>
      /* Instant splash shown while the app bundle loads; faded out by main.jsx. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: #f8fafc;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #app-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
      }
      .app-splash__brand {
        display: flex;
        align-items: center;
        gap: 12px;
        animation: app-splash-in 0.5s ease both;
      }
      .app-splash__mark {
        width: 52px;
        height: 52px;
        display: block;
        filter: drop-shadow(0 3px 8px rgba(30, 58, 138, 0.3));
      }
      .app-splash__name {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #0f172a;
      }
      .app-splash__bar {
        position: relative;
        width: 130px;
        height: 3px;
        border-radius: 99px;
        background: #dbe4f1;
        overflow: hidden;
      }
      .app-splash__bar::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        border-radius: inherit;
        background: #2563eb;
        animation: app-splash-slide 1s ease-in-out infinite;
      }
      @keyframes app-splash-slide {
        0% { left: -40%; }
        100% { left: 100%; }
      }
      @keyframes app-splash-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash { transition-duration: 0.01ms; }
        .app-splash__brand { animation: none; }
        .app-splash__bar::after { animation-duration: 2s; }
      }
      /* Splash follows the saved dark theme too. */
      html[data-theme='dark'] #app-splash {
        background: #0f172a;
      }
      html[data-theme='dark'] .app-splash__name {
        color: #ffffff;
      }
      html[data-theme='dark'] .app-splash__bar {
        background: #1e293b;
      }
      html[data-theme='dark'] .app-splash__bar::after {
        background: #3b82f6;
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="app-splash__brand">
        <img class="app-splash__mark" src="/images/logo-financequizword.png" width="52" height="52" alt="" />
        <span class="app-splash__name">FinanceQuizWord</span>
      </div>
      <span class="app-splash__bar"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
